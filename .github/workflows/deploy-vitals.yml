name: Deploy Vitals Script

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'ops/vitals.sh'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.66.193.15

      - name: Upload vitals.sh to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "ops/vitals.sh"
          target: "/tmp/"
          strip_components: 1

      - name: Install and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo cp /tmp/vitals.sh /opt/easy-rider/ops/vitals.sh
            sudo chmod 755 /opt/easy-rider/ops/vitals.sh
            rm -f /tmp/vitals.sh
            
            echo "Verifying script generates valid JSON..."
            if /opt/easy-rider/ops/vitals.sh --json | jq '.' > /dev/null; then
              echo "✅ Script deployed and JSON is valid"
            else
              echo "❌ Script deployed but JSON output is invalid"
              exit 1
            fi